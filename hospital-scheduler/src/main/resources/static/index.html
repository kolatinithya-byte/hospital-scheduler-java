<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediSchedule: Hospital Shift Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <span class="logo" aria-hidden="true">✚</span>
    <div>
      <h1>MediSchedule</h1>
      <p>Hospital staff shift planner</p>
    </div>
  </header>

  <main class="container">
    <section class="stats" aria-label="Shift summary">
      <div class="stat"><span id="statTotal">0</span><small>Total</small></div>
      <div class="stat scheduled"><span id="statScheduled">0</span><small>Scheduled</small></div>
      <div class="stat completed"><span id="statCompleted">0</span><small>Completed</small></div>
      <div class="stat cancelled"><span id="statCancelled">0</span><small>Cancelled</small></div>
    </section>

    <div class="layout">
      <!-- Assign shift form -->
      <section class="card">
        <h2>Assign a shift</h2>
        <div id="alert" class="alert hidden" role="alert"></div>

        <form id="shiftForm" novalidate>
          <label>
            <span>Staff member</span>
            <select id="staffId" required></select>
          </label>
          <label class="check">
            <input type="checkbox" id="onlyAvailable">
            <span>Only show staff available for this time</span>
          </label>
          <label>
            <span>Date</span>
            <input type="date" id="shiftDate" required>
          </label>
          <div class="row">
            <label><span>Start</span><input type="time" id="startTime" required></label>
            <label><span>End</span><input type="time" id="endTime" required></label>
          </div>
          <button type="submit" id="submitBtn" class="btn primary">Schedule shift</button>
        </form>
      </section>

      <!-- Shift list -->
      <section class="card">
        <div class="card-head">
          <h2>Shifts</h2>
          <select id="statusFilter" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="SCHEDULED">Scheduled</option>
            <option value="COMPLETED">Completed</option>
            <option value="CANCELLED">Cancelled</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Date</th><th>Time</th><th>Staff</th><th>Dept.</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr>
            </thead>
            <tbody id="shiftRows"></tbody>
          </table>
        </div>
        <p id="emptyState" class="empty hidden">No shifts found.</p>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
